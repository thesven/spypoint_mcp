[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spypoint-mcp"
version = "0.2.0"
description = "SPYPOINT fleet, image, archive, and analysis tools for MCP clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "httpx>=0.28,<0.29", "python-dotenv>=1.1,<2", "pillow>=11.3,<13", "pydantic>=2.11,<3", "starlette>=1.6,<2", "uvicorn>=0.53,<1"]

[project.scripts]
spypoint-mcp = "spypoint_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=7,<8", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240", "ASYNC230"]

[tool.hatch.build.targets.wheel]
packages = ["src/spypoint_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/scripts", "/.github", "/pyproject.toml", "/uv.lock", "/*.md", "/LIVE_VERIFICATION.json", "/.env.example"]

[tool.coverage.run]
branch = true
source = ["spypoint_mcp"]

[tool.coverage.report]
precision = 1
show_missing = true
fail_under = 88
